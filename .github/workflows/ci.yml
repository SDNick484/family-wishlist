name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r requirements.txt
      # Includes the Node tests for static/app.js; CI=true makes them fail rather than skip without Node.
      - run: python -m pytest -q

  alpine:
    # The container runs on Alpine's own py3-* packages, so test against exactly those.
    name: pytest (Alpine packages)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - run: apk add --no-cache python3 py3-flask py3-gunicorn py3-jwt py3-cryptography py3-pillow py3-pytest nodejs
      - uses: actions/checkout@v7
      - run: python3 -m pytest -q
